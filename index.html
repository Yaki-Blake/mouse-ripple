<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shuibo · 水波纹特效 Demo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; }
  #ripple {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  #ripple canvas { display: block; }
  .tip {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .45);
    color: #fff;
    font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif;
    letter-spacing: .5px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<div id="ripple"></div>
<p class="tip">移动鼠标产生涟漪，点击产生大水花（触屏可滑动）</p>

<script src="bg-datauri.js"></script>
<script src="webgl-ripples.js"></script>
<script>
  var el = document.getElementById('ripple');

  // 按视口宽度选择桌面版 / 手机版背景图
  var bg = window.innerWidth < 768
    ? window.__RIPPLE_BG__.mobile
    : window.__RIPPLE_BG__.desktop;

  // 先设为 CSS 背景：WebGL 不可用时仍有静态背景兜底
  el.style.backgroundImage = 'url(' + bg + ')';
  el.style.backgroundSize = 'cover';
  el.style.backgroundPosition = 'center';

  var ripple = new Ripples(el, {
    imageUrl: bg,
    resolution: 256,
    dropRadius: 20,
    perturbance: 0.03,
    interactive: true
  });

  // 每 3 秒自动落一滴水，无人交互时也能看到效果
  setInterval(function () {
    var rect = el.getBoundingClientRect();
    ripple.drop(
      Math.random() * rect.width,
      Math.random() * rect.height,
      24,
      0.06
    );
  }, 3000);
</script>

</body>
</html>
