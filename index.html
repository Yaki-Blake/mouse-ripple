		var dropPosition = new Float32Array([
			(2 * x - elWidth) / longestSide,
			(elHeight - 2 * y) / longestSide
		]);

		gl.viewport(0, 0, this.resolution, this.resolution);

		gl.bindFramebuffer(gl.FRAMEBUFFER, this.framebuffers[this.bufferWriteIndex]);
		bindTexture(this.textures[this.bufferReadIndex]);

		gl.useProgram(this.dropProgram.id);
		gl.uniform2fv(this.dropProgram.locations.center, dropPosition);
		gl.uniform1f(this.dropProgram.locations.radius, radius);
		gl.uniform1f(this.dropProgram.locations.strength, strength);

		this.drawQuad();

		this.swapBufferIndices();
	},

	updateSize: function() {

		var rect = this.element.getBoundingClientRect();

		var newWidth = rect.width,
				newHeight = rect.height;

		if (newWidth != this.canvas.width || newHeight != this.canvas.height) {
			this.canvas.width = newWidth;
			this.canvas.height = newHeight;
		}
	},

	destroy: function() {

		// TODO: use more effecient method to remove event listeners (with `removeEventListener`)
		// remove event listeners:
		var old_element = this.element;
		var new_element = old_element.cloneNode(true);
		old_element.parentNode.replaceChild(new_element, old_element);

		new_element.remove();

		this.canvas.remove();

		this.restoreCssBackground();

		this.destroyed = true;
	},

	show: function() {
		this.visible = true;

		// 原库调用 this.canvas.show()（jQuery），原生 DOM 下不存在，已改为标准样式操作。
		this.canvas.style.display = '';
		this.hideCssBackground();
	},

	hide: function() {
		this.visible = false;

		this.canvas.style.display = 'none';
		this.restoreCssBackground();
	},

	pause: function() {
		this.running = false;
	},

	play: function() {
		this.running = true;
	},

	set: function(property, value) {
		switch (property) {
			case 'dropRadius':
			case 'perturbance':
			case 'interactive':
			case 'crossOrigin':
				this[property] = value;
				break;
			case 'imageUrl':
				this.imageUrl = value;
				this.loadImage();
				break;
		}
	}
};

window.Ripples = Ripples;

})));

</script>
<script>
/* ===== 鼠标涟漪初始化 ===== */
(function () {
  'use strict';

  function boot() {
    if (!window.Ripples) {
      console.error('[ripples] 引擎未加载');
      return;
    }

    new window.Ripples(document.body, {
      imageUrl: window.__RIPPLE_BG__,   /* 显式传入，不依赖 CSS 内联样式 */
      resolution: 256,                  /* 波动模拟网格（边长） */
      dropRadius: 20,                   /* 单次涟漪半径 px */
      perturbance: 0.03,                /* 折射强度（波峰波谷的视觉强度） */
      interactive: true,
      crossOrigin: ''
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
